{% extends 'library/base.html' %}
{% block title %}Register - LibraryHub{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="text-align: center; color: #4a90e2; margin-bottom: 2rem;">Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">Have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
